name: product-catalog-cd

on:
  workflow_dispatch:
  push:
    branches: [gitops-bader-clean]
    paths:
      - 'src/product-catalog/**'
      - '.github/workflows/product-catalog-cd.yaml'

permissions:
  contents: write
  packages: write
  security-events: write

concurrency:
  group: product-catalog-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-push-update-gitops:
    name: Build, scan, push, and update GitOps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        id: image
        run: |
          OWNER_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-12)
          echo "image=ghcr.io/${OWNER_REPO}/product-catalog" >> "$GITHUB_OUTPUT"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${OWNER_REPO}/product-catalog:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image locally for security scan
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image.outputs.ref }}
      - name: Scan image with Trivy before push
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-product-catalog.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-product-catalog.sarif
      - name: Push image after scan
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.image }}:latest
      - name: Update product catalog deployment image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          sed -i -E "s#^([[:space:]]*)image: .*product-catalog.*#\1image: ${IMAGE_REF}#" kubernetes/productcatalog/deploy.yaml
          grep -n "image:" kubernetes/productcatalog/deploy.yaml
      - name: Commit GitOps image update
        run: |
          if git diff --quiet kubernetes/productcatalog/deploy.yaml; then
            echo "Deployment already uses ${{ steps.image.outputs.ref }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "ci: update product catalog image to ${{ steps.image.outputs.tag }}"
          git push origin HEAD:gitops-bader-clean