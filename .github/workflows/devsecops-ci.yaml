name: devsecops-ci

on:
  pull_request:
    branches: [main, gitops-bader-clean]
  push:
    branches: [gitops-bader-clean]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read
  security-events: write

concurrency:
  group: devsecops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-catalog-test:
    name: Product catalog build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/product-catalog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/product-catalog/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/product-catalog-service .

  docker-build-and-scan:
    name: Docker build and image scan
    runs-on: ubuntu-latest
    needs: product-catalog-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: false
          load: true
          tags: product-catalog:${{ github.sha }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: product-catalog:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

  kubernetes-and-gitops-security:
    name: Kubernetes, GitOps, and repository security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            kubernetes gitops/jaeger gitops/otel-collector gitops/cluster-autoscaler gitops/metrics-server
      - name: Scan repo with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-repo.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload repo scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-repo.sarif
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-security:
    name: Terraform validation and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Terraform
        id: detect
        run: |
          if find infra/terraform -name '*.tf' -print -quit 2>/dev/null | grep -q .; then
            echo "has_terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_terraform=false" >> "$GITHUB_OUTPUT"
            echo "No infra/terraform directory in this branch; skipping Terraform checks."
          fi
      - name: Set up Terraform
        if: steps.detect.outputs.has_terraform == 'true'
        uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        if: steps.detect.outputs.has_terraform == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init without backend
        if: steps.detect.outputs.has_terraform == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        if: steps.detect.outputs.has_terraform == 'true'
        working-directory: infra/terraform
        run: terraform validate
      - name: Checkov Terraform scan
        if: steps.detect.outputs.has_terraform == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
